<!DOCTYPE html>
<html>
<head>
    <title>Fake Shopping Website Detector</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0b2a5b;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 600px;
            max-width: 85%;
            margin: 70px auto;
            background: #12366f;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
            text-align: center;
        }

        h1 {
            color: white;
        }

        .container > p {
            color: white;
        }

        input {
            width: 90%;
            padding: 14px;
            margin-top: 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            margin-top: 20px;
            padding: 13px 30px;
            background: #1f4fa3;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #2d65c4;
        }

        .result {
            margin-top: 30px;
            padding: 20px;
            border-radius: 10px;
        }

        .result p {
            color: #333;
            font-size: 18px;
        }

        .result strong {
            color: #111;
            font-weight: bold;
        }

        .high {
            background: #ffe5e5;
            color: #b00020;
        }

        .medium {
            background: #fff3cd;
            color: #856404;
        }

        .low {
            background: #e4f7e8;
            color: #176b2c;
        }

        .result h2 {
            margin-top: 0;
        }

        ul {
            text-align: left;
            display: inline-block;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🛡️ Fake Shopping Website Detector</h1>

    <p>Check whether a shopping website looks suspicious.</p>

    <input
        type="text"
        id="urlInput"
        placeholder="Enter website URL"
    >

    <br>

    <button onclick="checkWebsite()">CHECK WEBSITE</button>

    <div id="result"></div>

</div>


<script>

function checkWebsite() {

    let url = document.getElementById("urlInput").value.trim();

    if (url === "") {
        alert("Please enter a website URL.");
        return;
    }

    // Add https if user does not enter it
    if (!url.startsWith("http://") && !url.startsWith("https://")) {
        url = "https://" + url;
    }

    let score = 0;
    let reasons = [];

    try {

        let website = new URL(url);

        // ==========================================
        // 1. CHECK HTTPS
        // ==========================================

        if (website.protocol !== "https:") {

            score += 20;

            reasons.push(
                "Website is not using HTTPS."
            );
        }


        // ==========================================
        // 2. CHECK SUSPICIOUS KEYWORDS
        // ==========================================

        let suspiciousWords = {

            "login": 10,
            "signin": 10,
            "verify": 15,
            "verification": 15,
            "security": 10,
            "account": 10,
            "update": 10,
            "confirm": 10,
            "paypal": 15,
            "bank": 20,
            "payment": 20,
            "password": 25,
            "free": 10,
            "winner": 15,
            "claim": 15,
            "offer": 10,
            "discount": 10,
            "cheap": 10,
            "deal": 10,
            "prize": 15

        };

        let lowerURL = url.toLowerCase();

        let foundWords = [];

        Object.keys(suspiciousWords).forEach(function(word) {

            if (lowerURL.includes(word)) {

                score += suspiciousWords[word];

                foundWords.push(word);
            }

        });


        if (foundWords.length > 0) {

            reasons.push(
                "Suspicious keywords found: " +
                foundWords.join(", ")
            );

        }


        // ==========================================
        // 3. CHECK VERY LONG URL
        // ==========================================

        if (url.length > 100) {

            score += 15;

            reasons.push(
                "The URL is unusually long."
            );

        }


        // ==========================================
        // 4. CHECK TOO MANY HYPHENS
        // ==========================================

        let hyphens =
            (website.hostname.match(/-/g) || []).length;

        if (hyphens >= 3) {

            score += 15;

            reasons.push(
                "The domain contains many hyphens."
            );

        }


        // ==========================================
        // 5. CHECK SUSPICIOUS @ SYMBOL
        // ==========================================

        if (url.includes("@")) {

            score += 20;

            reasons.push(
                "The URL contains a suspicious @ symbol."
            );

        }


        // ==========================================
        // 6. CHECK IP ADDRESS
        // ==========================================

        let ipPattern =
            /^(\d{1,3}\.){3}\d{1,3}$/;

        if (ipPattern.test(website.hostname)) {

            score += 25;

            reasons.push(
                "The website uses an IP address instead of a normal domain name."
            );

        }


        // ==========================================
        // 7. CHECK SUSPICIOUS DOMAIN EXTENSIONS
        // ==========================================

        let suspiciousExtensions = [
            ".tk",
            ".ml",
            ".ga",
            ".cf",
            ".gq"
        ];

        let hostname =
            website.hostname.toLowerCase();

        suspiciousExtensions.forEach(function(extension) {

            if (hostname.endsWith(extension)) {

                score += 15;

                reasons.push(
                    "The domain uses a commonly suspicious free domain extension: " +
                    extension
                );

            }

        });


        // ==========================================
        // MAXIMUM SCORE
        // ==========================================

        if (score > 100) {
            score = 100;
        }


        // ==========================================
        // RISK LEVEL
        // ==========================================

        let result = "";
        let riskClass = "";


        if (score >= 60) {

            result = "🔴 HIGH RISK";

            riskClass = "high";

        }

        else if (score >= 30) {

            result = "🟡 MEDIUM RISK";

            riskClass = "medium";

        }

        else {

            result = "🟢 LOW RISK";

            riskClass = "low";

        }


        // ==========================================
        // ADDITIONAL MESSAGES
        // ==========================================

        if (riskClass === "low") {

            reasons.push(
                "No major suspicious indicators were detected."
            );

            reasons.push(
                "The website has a low risk score."
            );

            reasons.push(
                "No common suspicious URL patterns were found."
            );

            reasons.push(
                "The website appears relatively safe."
            );

        }


        else if (riskClass === "medium") {

            reasons.push(
                "Some suspicious indicators were detected."
            );

            reasons.push(
                "Please verify the website before entering personal information."
            );

            reasons.push(
                "Be careful before making any payment."
            );

            reasons.push(
                "Check the website details carefully before proceeding."
            );

        }


        else if (riskClass === "high") {

            reasons.push(
                "Multiple suspicious indicators were detected."
            );

            reasons.push(
                "This website may be unsafe or fraudulent."
            );

            reasons.push(
                "Do not enter personal or banking information."
            );

            reasons.push(
                "Avoid making payments on this website."
            );

        }


        // ==========================================
        // CREATE REASON LIST
        // ==========================================

        let reasonList = "";

        reasons.forEach(function(reason) {

            reasonList +=
                "<li>" + reason + "</li>";

        });


        // ==========================================
        // DISPLAY RESULT
        // ==========================================

        document.getElementById("result").innerHTML = `

            <div class="result ${riskClass}">

                <h2>${result}</h2>

                <p>
                    Risk Score:
                    <strong>${score}/100</strong>
                </p>

                <p>
                    Risk Percentage:
                    <strong>${score}%</strong>
                </p>

                <h3>Reasons:</h3>

                <ul>
                    ${reasonList}
                </ul>

            </div>

        `;

    }


    catch (error) {

        document.getElementById("result").innerHTML = `

            <div class="result high">

                <h2>🔴 INVALID URL</h2>

                <p>
                    Please enter a valid website URL.
                </p>

            </div>

        `;

    }

}

</script>

</body>
</html>
