<!DOCTYPE html>
<html>
<head>
    <title>Fake Shopping Website Detector</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0b2a5b;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 600px;
            max-width: 85%;
            margin: 70px auto;
            background: #12366f;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
            text-align: center;
        }

        h1 {
            color: white;
        }

        p {
            color: white;
        }

        input {
            width: 90%;
            padding: 14px;
            margin-top: 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            margin-top: 20px;
            padding: 13px 30px;
            background: #1f4fa3;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #2d65c4;
        }

        .result {
            margin-top: 30px;
            padding: 20px;
            border-radius: 10px;
        }

        .high {
            background: #ffe5e5;
            color: #b00020;
        }

        .medium {
            background: #fff3cd;
            color: #856404;
        }

        .low {
            background: #e4f7e8;
            color: #176b2c;
        }

        .result h2 {
            margin-top: 0;
        }

        ul {
            text-align: left;
            display: inline-block;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🛡️ Fake Shopping Website Detector</h1>

    <p>Check whether a shopping website looks suspicious.</p>

    <input type="text" id="urlInput" placeholder="Enter website URL">

    <br>

    <button onclick="checkWebsite()">CHECK WEBSITE</button>

    <div id="result"></div>

</div>


<script>

function checkWebsite() {

    let url = document.getElementById("urlInput").value.trim();

    if (url === "") {
        alert("Please enter a website URL.");
        return;
    }

    // Add https if user does not enter it
    if (!url.startsWith("http://") && !url.startsWith("https://")) {
        url = "https://" + url;
    }

    let score = 0;
    let reasons = [];

    try {

        let website = new URL(url);

        // 1. Check HTTPS
        if (website.protocol !== "https:") {
            score += 20;
            reasons.push("Website is not using HTTPS.");
        }

        // 2. Check suspicious keywords
        let suspiciousWords = [
            "free",
            "winner",
            "claim",
            "offer",
            "discount",
            "cheap",
            "deal",
            "prize"
        ];

        let lowerURL = url.toLowerCase();

        let foundWords = [];

        suspiciousWords.forEach(function(word) {
            if (lowerURL.includes(word)) {
                foundWords.push(word);
            }
        });

        if (foundWords.length > 0) {
            score += 15;
            reasons.push(
                "Suspicious keyword found: " + foundWords.join(", ")
            );
        }

        // 3. Check very long URL
        if (url.length > 100) {
            score += 15;
            reasons.push("The URL is unusually long.");
        }

        // 4. Check too many hyphens
        let hyphens = (website.hostname.match(/-/g) || []).length;

        if (hyphens >= 3) {
            score += 15;
            reasons.push("The domain contains many hyphens.");
        }

        // 5. Check suspicious characters
        if (website.hostname.includes("@")) {
            score += 20;
            reasons.push("The URL contains a suspicious @ symbol.");
        }

        // 6. Check IP address instead of domain
        let ipPattern = /^(\d{1,3}\.){3}\d{1,3}$/;

        if (ipPattern.test(website.hostname)) {
            score += 25;
            reasons.push("The website uses an IP address instead of a normal domain name.");
        }

        // Maximum score
        if (score > 100) {
            score = 100;
        }

        let result = "";
        let riskClass = "";

        if (score >= 60) {

            result = "🔴 HIGH RISK";
            riskClass = "high";

        } else if (score >= 30) {

            result = "🟡 MEDIUM RISK";
            riskClass = "medium";

        } else {

            result = "🟢 LOW RISK";
            riskClass = "low";

        }

        if (reasons.length === 0) {
            reasons.push("No major suspicious indicators were detected.");
        }

        let reasonList = "";

        reasons.forEach(function(reason) {
            reasonList += "<li>" + reason + "</li>";
        });

        document.getElementById("result").innerHTML = `

            <div class="result ${riskClass}">

                <h2>${result}</h2>

                <p>
                    Risk Score:
                    <strong>${score}/100</strong>
                </p>

                <p>
                    Risk Percentage:
                    <strong>${score}%</strong>
                </p>

                <h3>Reasons:</h3>

                <ul>
                    ${reasonList}
                </ul>

            </div>
        `;

    } catch (error) {

        document.getElementById("result").innerHTML = `

            <div class="result high">

                <h2>🔴 INVALID URL</h2>

                <p>Please enter a valid website URL.</p>

            </div>

        `;
    }
}

</script>

</body>
</html>
